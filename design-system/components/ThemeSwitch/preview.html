<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><title>ThemeSwitch — preview</title></head>
<body class="cv-canvas">
<div class="cv-stage" style="align-items:center;gap:20px">
  <button class="cv-theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark theme">
    <span class="cv-theme-switch__knob" aria-hidden="true"></span>
    <svg class="cv-theme-switch__icon cv-theme-switch__icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2m0 15v2M4.6 4.6 6 6m12 12 1.4 1.4M2.5 12h2m15 0h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    <svg class="cv-theme-switch__icon cv-theme-switch__icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6Z"/></svg>
  </button>
  <span style="font:500 12px/1 var(--font-mono);color:var(--ink-2)">click to toggle</span>
</div>
<script>
  document.querySelector('.cv-theme-switch').addEventListener('click', function () {
    this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  });
</script>
</body>
</html>
